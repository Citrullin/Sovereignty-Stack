apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-postgresql
  namespace: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n-postgresql
  template:
    metadata:
      labels:
        app: n8n-postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:15
        env:
        - name: POSTGRES_USER
          value: "n8n"
        - name: POSTGRES_PASSWORD
          value: "n8npassword"
        - name: POSTGRES_DB
          value: "n8n"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: n8n-postgresql-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-postgresql-pvc
  namespace: n8n
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-postgresql
  namespace: n8n
spec:
  selector:
    app: n8n-postgresql
  ports:
  - port: 5432
    targetPort: 5432
