apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bookstack-manual
  namespace: bookstack
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
  - host: bookstack.homelab.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bookstack-bookstack
            port:
              number: 8080
