version: 1
metadata:
  name: siwe-source
entries:
  - model: authentik_sources_oauth.oauthsource
    id: source-siwe
    identifiers:
      slug: siwe
    attrs:
      name: Sign-In with Ethereum
      slug: siwe
      enabled: true
      authentication_flow: !Find [authentik_flows.Flow, [slug, default-source-authentication]]
      enrollment_flow: !Find [authentik_flows.Flow, [slug, default-source-enrollment]]
      provider_type: openidconnect
      authorization_url: https://siwe.homelab.local/authorize
      access_token_url: https://siwe.homelab.local/token
      profile_url: https://siwe.homelab.local/userinfo
      oidc_well_known_url: https://siwe.homelab.local/.well-known/openid-configuration
      consumer_key: siwe-client
      consumer_secret: siwe-secret
      user_matching_mode: identifier
