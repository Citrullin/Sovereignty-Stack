version: 1
metadata:
  name: homelab-apps-v7
  labels:
    type: homelab

  # -------------------------------------------------------------------------
  # Custom Property Mappings
  # -------------------------------------------------------------------------
entries:
  # -------------------------------------------------------------------------
  # Custom Property Mappings
  # -------------------------------------------------------------------------
  - model: authentik_providers_oauth2.scopemapping
    id: scope-email-verified
    identifiers:
      name: "Scope Mapping email_verified"
    attrs:
      name: "Scope Mapping email_verified"
      scope_name: email
      expression: |
        return {
            "email": request.user.email,
            "email_verified": True
        }

  - model: authentik_providers_oauth2.scopemapping
    id: scope-groups
    identifiers:
      name: "Scope Mapping groups"
    attrs:
      name: "Scope Mapping groups"
      scope_name: groups
      expression: |
        groups = [group.name for group in request.user.ak_groups.all()]
        if request.user.is_superuser or request.user.username == "akadmin":
            if "authentik Admins" not in groups:
                groups.append("authentik Admins")
            if "admin" not in groups:
                groups.append("admin")
            if "Admin" not in groups:
                groups.append("Admin")
        return {
            "groups": groups
        }

  # -------------------------------------------------------------------------
  # Bookstack
  # -------------------------------------------------------------------------
  - model: authentik_providers_oauth2.scopemapping
    id: scope-bookstack-groups
    identifiers:
      name: scope-bookstack-groups
    attrs:
      scope_name: groups
      description: Bookstack Groups
      expression: |
        groups = [group.name for group in request.user.ak_groups.all()]
        if request.user.is_superuser or request.user.username == "akadmin":
            groups.append("Admin")
            groups.append("authentik Admins")
        return {
            "groups": groups
        }

  - model: authentik_providers_oauth2.scopemapping
    id: scope-chiefonboarding-admin
    identifiers:
      name: scope-chiefonboarding-admin
    attrs:
      scope_name: profile
      description: ChiefOnboarding Admin Flags
      expression: |
        groups = []
        is_admin = request.user.is_superuser or request.user.username == "akadmin"
        if is_admin:
            groups.append("Admin")
        return {
            "groups": groups
        }

  - model: authentik_providers_oauth2.oauth2provider
    id: provider-bookstack
    identifiers:
      name: Bookstack V2
    attrs:
      name: Bookstack V2
      client_id: bookstack-v2-app
      client_secret: bf27cd9f55be54583d0b6874756eaac6
      authorization_flow: !Find [authentik_flows.Flow, [slug, default-provider-authorization-explicit-consent]]
      authentication_flow: !Find [authentik_flows.Flow, [slug, default-authentication-flow]]
      invalidation_flow: !Find [authentik_flows.Flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.CertificateKeyPair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - url: https://bookstack.homelab.local/oidc/callback
          matching_mode: strict
      property_mappings:
        - !KeyOf scope-email-verified
        - !Find [authentik_providers_oauth2.ScopeMapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.ScopeMapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf scope-bookstack-groups
      sub_mode: hashed_user_id
      issuer_mode: per_provider

  - model: authentik_core.application
    identifiers:
      slug: bookstack-v2
    attrs:
      name: Bookstack V2
      slug: bookstack-v2
      provider: !KeyOf provider-bookstack
      meta_launch_url: https://bookstack.homelab.local
      meta_icon: https://bookstack.homelab.local/icon.png
      policy_engine_mode: any

