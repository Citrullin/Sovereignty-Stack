apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taiga.fullname" . }}-config
  labels:
    {{- include "taiga.labels" . | nindent 4 }}
data:
  # Backend Configuration (local.py is imported by settings/common.py)
  local.py: |
    from .config import *

    MEDIA_URL = "{{ .Values.scheme }}://{{ .Values.domain }}/media/"
    STATIC_URL = "{{ .Values.scheme }}://{{ .Values.domain }}/static/"
    SITES["front"]["scheme"] = "{{ .Values.scheme }}"
    SITES["front"]["domain"] = "{{ .Values.domain }}"
    SITES["api"]["scheme"] = "{{ .Values.scheme }}"
    SITES["api"]["domain"] = "{{ .Values.domain }}"
    # Celery config
    CELERY_ENABLED = True
    BROKER_URL = "amqp://{{ .Values.rabbitmq.auth.username }}:{{ .Values.rabbitmq.auth.password }}@{{ include "taiga.fullname" . }}-rabbitmq:5672/taiga"
    CELERY_BROKER_URL = BROKER_URL
    
    DEBUG = False
    GRAVATAR_ENABLED = False
    
    # Enhanced Logging
    LOGGING = {
        'version': 1,
        'disable_existing_loggers': False,
        'handlers': {
            'console': {
                'level': 'INFO',
                'class': 'logging.StreamHandler',
            },
        },
        'loggers': {
            'django': {
                'handlers': ['console'],
                'level': 'INFO',
            },
            'taiga': {
                'handlers': ['console'],
                'level': 'INFO',
            },
        },
    }

    CSRF_TRUSTED_ORIGINS = ["{{ .Values.scheme }}://{{ .Values.domain }}"]
    ALLOWED_HOSTS = ["*"]
    
    # Trust the X-Forwarded-Proto header from Traefik
    SECURE_PROXY_SSL_HEADER = ("HTTP_X_FORWARDED_PROTO", "https")
    USE_X_FORWARDED_HOST = True
    USE_X_FORWARDED_PORT = True

    SECRET_KEY = "{{ .Values.backend.secretKey }}"

    DATABASES = {
        "default": {
            "ENGINE": "django.db.backends.postgresql",
            "NAME": "{{ .Values.postgresql.auth.database }}",
            "USER": "{{ .Values.postgresql.auth.username }}",
            "PASSWORD": "{{ .Values.postgresql.auth.password }}",
            "HOST": "{{ include "taiga.fullname" . }}-postgres",
            "PORT": "5432",
        }
    }

    EVENTS_PUSH_BACKEND = "taiga.events.backends.rabbitmq.EventsPushBackend"
    EVENTS_PUSH_BACKEND_OPTIONS = {
        "url": "amqp://{{ .Values.rabbitmq.auth.username }}:{{ .Values.rabbitmq.auth.password }}@{{ include "taiga.fullname" . }}-rabbitmq:5672/taiga"
    }

    # OIDC Configuration
    INSTALLED_APPS += ["mozilla_django_oidc", "taiga_contrib_oidc_auth"]
    AUTHENTICATION_BACKENDS = ("taiga_contrib_oidc_auth.oidc.TaigaOIDCAuthenticationBackend",) + AUTHENTICATION_BACKENDS

    OIDC_RSA_PRIVATE_KEY = None
    OIDC_RSA_PUBLIC_KEY = None
    OIDC_RP_CLIENT_ID = "{{ .Values.oidc.clientId }}"
    OIDC_RP_CLIENT_SECRET = "{{ .Values.oidc.clientSecret }}"
    OIDC_OP_AUTHORIZATION_ENDPOINT = "https://authentik.homelab.local/application/o/authorize/"
    OIDC_OP_TOKEN_ENDPOINT = "https://authentik.homelab.local/application/o/token/"
    OIDC_OP_USER_ENDPOINT = "https://authentik.homelab.local/application/o/userinfo/"
    OIDC_RP_SIGN_ALGO = "RS256"
    OIDC_OP_JWKS_ENDPOINT = "https://authentik.homelab.local/application/o/taiga-oidc/jwks/"
    OIDC_RP_SCOPES = "openid email profile"

    # Enable if needed
    OIDC_CREATE_USER = True
    OIDC_VERIFY_SSL = False  # Required for self-signed certificates in homelab


  # Frontend Configuration (conf.json)
  conf.json: |
    {
        "api": "https://{{ .Values.domain }}/api/v1/",
        "eventsUrl": "wss://{{ .Values.domain }}/events",
        "eventsMaxMissedHeartbeats": 5,
        "eventsHeartbeatIntervalTime": 60000,
        "eventsPoolSpeed": 1500,
        "debug": false,
        "debugInfo": false,
        "defaultLanguage": "en",
        "themes": ["taiga"],
        "defaultTheme": "taiga",
        "publicRegisterEnabled": true,
        "feedbackEnabled": true,
        "gravatar": false,
        "privacyPolicyUrl": null,
        "termsOfServiceUrl": null,
        "GDPRUrl": null,
        "maxUploadFileSize": null,
        "contribPlugins": ["/plugins/oidc-auth/plugins.json"],
        "oidcAuthUrl": "https://authentik.homelab.local/application/o/authorize/",
        "oidcClientId": "{{ .Values.oidc.clientId }}",
        "oidcButtonText": "Authentik",
        "oidcButtonImage": "openid.png",
        "oidcScope": "openid email profile"
    }

  # Frontend Plugin Configuration (This file is loaded by the initContainer)
  plugins.json: |
    {
        "name": "oidc-auth",
        "slug": "oidc-auth",
        "type": "plugin",
        "files": {
            "js": ["oidc-auth.js"]
        }
    }

  # Consolidated Backend Patching Script
  patch-taiga.py: |
    import sys, os, re, requests
    from django.core.files.base import ContentFile

    def patch_urls():
        path = '/taiga-back/taiga/urls.py'
        if not os.path.exists(path): return
        c = open(path).read()
        if 'TaigaOIDCAuthenticationCallbackView' not in c:
            print("Patching urls.py...")
            imports = ""
            if 'from mozilla_django_oidc.views' not in c:
                imports += 'from mozilla_django_oidc.views import OIDCAuthenticationRequestView\n'
            if 'from taiga_contrib_oidc_auth.views' not in c:
                imports += 'from taiga_contrib_oidc_auth.views import TaigaOIDCAuthenticationCallbackView\n'
            c = imports + c
            c = re.sub(r"re_path\(r'\^oidc/authenticate.*?\n", "", c)
            c = re.sub(r"re_path\(r'\^oidc/callback.*?\n", "", c)
            c = re.sub(r"re_path\(r'\^oidc/.*?\),", "", c)
            patch = 'urlpatterns = [\n    re_path(r"^oidc/authenticate/?$", OIDCAuthenticationRequestView.as_view(), name="oidc_authentication_init"),\n    re_path(r"^oidc/callback/?$", TaigaOIDCAuthenticationCallbackView.as_view(), name="oidc_authentication_callback"),\n    re_path(r"^oidc/", include("mozilla_django_oidc.urls")),'
            c = c.replace('urlpatterns = [', patch)
            with open(path, 'w') as f: f.write(c)

    def patch_oidc_plugin():
        path = '/opt/venv/lib/python3.11/site-packages/taiga_contrib_oidc_auth/oidc.py'
        if not os.path.exists(path): return
        with open(path, 'r') as f: c = f.read()
        if 'FIX IDENTITY' not in c:
            print("Patching oidc.py...")
            NL = chr(10)
            if 'import requests' not in c:
                c = "import sys, requests" + NL + "from django.core.files.base import ContentFile" + NL + c
            c = c.replace('nickname = claims.get("nickname")', 
                          'nickname = claims.get("preferred_username") or claims.get("nickname") or claims.get("email", "").split("@")[0]')
            new_update = "    def update_user(self, user, claims):" + NL + \
                         "        # FIX IDENTITY" + NL + \
                         "        updated = False" + NL + \
                         "        if 'name' in claims and user.full_name != claims['name']:" + NL + \
                         "            user.full_name = claims['name']" + NL + \
                         "            updated = True" + NL + \
                         "        new_username = self.get_username(claims)" + NL + \
                         "        if new_username and user.username != new_username:" + NL + \
                         "            if not self.UserModel.objects.filter(username=new_username).exists():" + NL + \
                         "                user.username = new_username" + NL + \
                         "                updated = True" + NL + \
                         "        photo_url = claims.get('picture')" + NL + \
                         "        if photo_url and not user.photo:" + NL + \
                         "            try:" + NL + \
                         "                resp = requests.get(photo_url, timeout=5, verify=False)" + NL + \
                         "                if resp.status_code == 200:" + NL + \
                         "                    user.photo.save(f'oidc_{user.id}.png', ContentFile(resp.content), save=False)" + NL + \
                         "                    updated = True" + NL + \
                         "            except Exception as e:" + NL + \
                         "                sys.stderr.write(f'OIDC: Photo sync failed: {e}' + chr(10))" + NL + \
                         "        if updated:" + NL + \
                         "            user.save()" + NL + \
                         "        return user"
            pattern = r'    def update_user\(self, user, claims\):.*?return user'
            c = re.sub(pattern, new_update, c, flags=re.DOTALL)
            with open(path, 'w') as f: f.write(c)

    def setup_rabbitmq():
        import time
        user = "{{ .Values.rabbitmq.auth.username }}"
        pw = "{{ .Values.rabbitmq.auth.password }}"
        host = "{{ include "taiga.fullname" . }}-rabbitmq"
        vhost = "taiga"
        
        # Management API URL
        url = f"http://{host}:15672/api/vhosts/{vhost}"
        
        max_retries = 12
        retry_delay = 5
        
        for i in range(max_retries):
            try:
                print(f"Checking RabbitMQ vhost '{vhost}' via API (attempt {i+1}/{max_retries})...")
                r = requests.get(url, auth=(user, pw), timeout=5)
                if r.status_code == 404:
                    print(f"Creating vhost '{vhost}'...")
                    r = requests.put(url, auth=(user, pw), timeout=5)
                    r.raise_for_status()
                
                # Set permissions for the user on the vhost (PUT /api/permissions/vhost/user)
                perm_url = f"http://{host}:15672/api/permissions/{vhost}/{user}"
                print(f"Setting permissions for user '{user}' on vhost '{vhost}'...")
                r = requests.put(perm_url, auth=(user, pw), json={
                    "configure": ".*",
                    "write": ".*",
                    "read": ".*"
                }, timeout=5)
                r.raise_for_status()
                print("RabbitMQ setup complete.")
                return # SUCCESS
            except Exception as e:
                print(f"RabbitMQ attempt {i+1} failed: {e}")
                if i < max_retries - 1:
                    time.sleep(retry_delay)
        
        print("RabbitMQ setup FAILED after all retries.")

    if __name__ == "__main__":
        patch_urls()
        patch_oidc_plugin()
        setup_rabbitmq()


  # Events Configuration (config.json)
  events-config.json: |
    {
        "url": "amqp://{{ .Values.rabbitmq.auth.username }}:{{ .Values.rabbitmq.auth.password }}@{{ include "taiga.fullname" . }}-rabbitmq:5672/taiga",
        "secret": "{{ .Values.backend.secretKey }}",
        "webSocketServer": {
            "port": 8888
        }
    }

  # Runtime patch for OIDC script injection and Nginx proxy fallback
  patch-oidc.sh: |
    #!/bin/sh
    echo "Patching index.html for OIDC (Early Capture & Dynamic Loader)..."
    cp /usr/share/nginx/html/index.html /tmp/index.html
    # Inject a script that captures OIDC params IMMEDIATELY and then loads the plugin
    LOADER_SCRIPT='<script>(function(){console.log("OIDC: Early stage capture started");var p={};var s=window.location.search||(window.location.hash.indexOf("?")!==-1?window.location.hash.substring(window.location.hash.indexOf("?")):"");if(s){s.substr(1).split("&").forEach(function(i){var b=i.split("="),k=b[0],v=b[1]&&decodeURIComponent(b[1]);if(k)p[k]=v;});if(p.type==="oidc"&&p.auth_token){console.log("OIDC: Capture successful");window.sessionStorage.setItem("taiga_oidc_params",JSON.stringify(p));}}var l=function(){if(window.angular){var j=document.createElement("script");j.src="/plugins/oidc-auth/oidc-auth.js";document.body.appendChild(j);console.log("OIDC: Loader triggered.");}else{setTimeout(l,500);}};l();})();</script>'
    sed -i "/<\/body>/i $LOADER_SCRIPT" /tmp/index.html
    cp /tmp/index.html /usr/share/nginx/html/index.html
    echo "index.html patched with early capture loader."
    
    echo "Patching nginx config for OIDC proxy fallback..."
    # Add /oidc location before the main / location
    sed -i '/location \/ {/i \    location /oidc/ {\n        proxy_set_header Host $host;\n        proxy_pass http://{{ include "taiga.fullname" . }}-backend:8000/oidc/;\n    }\n    location /oidc {\n        proxy_set_header Host $host;\n        proxy_pass http://{{ include "taiga.fullname" . }}-backend:8000/oidc;\n    }' /etc/nginx/conf.d/default.conf
    nginx -s reload
    echo "nginx configured with OIDC proxy fallback."
