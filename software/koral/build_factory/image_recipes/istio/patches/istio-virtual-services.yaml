apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: erpnext
  namespace: erpnext
spec:
  hosts:
  - "erpnext.homelab.local"
  gateways:
  - istio-system/homelab-gateway
  http:
  - match:
    - uri:
        prefix: "/socket.io"
    route:
    - destination:
        host: erpnext-socketio.erpnext.svc.cluster.local
        port:
          number: 9000
      headers:
        request:
          set:
            Host: erpnext.homelab.local
            x-frappe-site-name: erpnext.homelab.local
            x-forwarded-proto: https
  - route:
    - destination:
        host: erpnext.erpnext.svc.cluster.local
        port:
          number: 8080
      headers:
        request:
          set:
            x-frappe-site-name: erpnext.homelab.local
            x-forwarded-proto: https
