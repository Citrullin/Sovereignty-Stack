apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  hosts:
  - "nextcloud.homelab.local"
  gateways:
  - istio-system/homelab-gateway
  http:
  - route:
    - destination:
        host: nextcloud.nextcloud.svc.cluster.local
        port:
          number: 8080
      headers:
        request:
          set:
            x-forwarded-proto: https
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: collabora
  namespace: nextcloud
spec:
  hosts:
  - "collabora.homelab.local"
  gateways:
  - istio-system/homelab-gateway
  http:
  - match:
    - uri:
        regex: ".*/logo/logo.svg"
    redirect:
       authority: "nextcloud.homelab.local"
       uri: "/core/img/logo/logo.svg"
       redirectCode: 302
  - match:
    - uri:
        regex: "/browser/.*/images/dark/lc_settings.svg"
    rewrite:
      uri: "/browser/dist/images/lc_settings.svg"
    route:
    - destination:
        host: collabora.nextcloud.svc.cluster.local
        port:
          number: 9980
      headers:
        request:
          set:
            x-forwarded-proto: https
  - match:
    - uri:
        regex: "/browser/.*/images/dark/lc_overflow-morebutton.svg"
    rewrite:
      uri: "/browser/dist/images/lc_overflow-morebutton.svg"
    route:
    - destination:
        host: collabora.nextcloud.svc.cluster.local
        port:
          number: 9980
      headers:
        request:
          set:
            x-forwarded-proto: https
  - route:
    - destination:
        host: collabora.nextcloud.svc.cluster.local
        port:
          number: 9980
      headers:
        request:
          set:
            x-forwarded-proto: https
---
