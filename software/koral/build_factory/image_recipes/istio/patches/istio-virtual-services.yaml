apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: taiga
  namespace: taiga
spec:
  hosts:
  - "taiga.homelab.local"
  gateways:
  - istio-system/homelab-gateway
  http:
  - match:
    - uri:
        prefix: "/api"
    - uri:
        prefix: "/admin"
    - uri:
        prefix: "/static"
    - uri:
        prefix: "/media"
    - uri:
        prefix: "/oidc"
    route:
    - destination:
        host: taiga-backend.taiga.svc.cluster.local
        port:
          number: 8000
      headers:
        request:
          set:
            x-forwarded-proto: https
  - match:
    - uri:
        prefix: "/events"
    route:
    - destination:
        host: taiga-events.taiga.svc.cluster.local
        port:
          number: 8888
      headers:
        request:
          set:
            x-forwarded-proto: https
  - route:
    - destination:
        host: taiga-frontend.taiga.svc.cluster.local
        port:
          number: 80
      headers:
        request:
          set:
            x-forwarded-proto: https
