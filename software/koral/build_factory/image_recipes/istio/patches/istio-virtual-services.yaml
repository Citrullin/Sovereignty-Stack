apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: paralus
  namespace: paralus
spec:
  hosts:
  - "paralus.homelab.local"
  gateways:
  - istio-system/homelab-gateway
  http:
  - match:
    - uri:
        prefix: /auth
    - uri:
        prefix: /event
    - uri:
        prefix: /infra
    - uri:
        prefix: /v2/sentry
    route:
    - destination:
        host: paralus.paralus.svc.cluster.local
        port:
          number: 11000
      headers:
        request:
          set:
            x-forwarded-proto: https
  - match:
    - uri:
        prefix: /v2/debug/prompt
    route:
    - destination:
        host: prompt.paralus.svc.cluster.local
        port:
          number: 7009
      headers:
        request:
          set:
            x-forwarded-proto: https
  - match:
    - uri:
        prefix: /self-service
    route:
    - destination:
        host: paralus-kratos-public.paralus.svc.cluster.local
        port:
          number: 80
      headers:
        request:
          set:
            x-forwarded-proto: https
  - route:
    - destination:
        host: dashboard.paralus.svc.cluster.local
        port:
          number: 80
      headers:
        request:
          set:
            x-forwarded-proto: https
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: paralus-connectors
  namespace: paralus
spec:
  hosts:
  - "*.core-connector.paralus.homelab.local"
  - "*.user.paralus.homelab.local"
  gateways:
  - istio-system/homelab-gateway
  tls:
  - match:
    - port: 443
      sniHosts:
      - "*.core-connector.paralus.homelab.local"
      - "*.user.paralus.homelab.local"
    route:
    - destination:
        host: relay-server.paralus.svc.cluster.local
        port:
          number: 443
